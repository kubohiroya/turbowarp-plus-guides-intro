<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360"><g font-family="Noto Sans JP,Hiragino Kaku Gothic ProN,Arial,sans-serif"><rect width="480" height="360" fill="#edf3fb"/><rect width="480" height="78" fill="#28365d"/><text x="18" y="34" font-size="21" font-weight="700" fill="#ffffff">はじめての8章</text><text x="18" y="58" font-size="12" font-weight="500" fill="#e1e9ff">気になる章へ直接進めます。約15〜20分の目安。</text><text x="18" y="343" font-size="11" font-weight="500" fill="#53617e">章末の「おすすめの次へ」で順に巡れます。</text><rect x="22" y="86" width="210" height="36" rx="9" fill="white" stroke="#5156ba" stroke-width="2"/><text x="31" y="109" font-size="13" font-weight="700" fill="#263454">01  こんな場面で助かる</text><rect x="248" y="86" width="210" height="36" rx="9" fill="white" stroke="#5156ba" stroke-width="2"/><text x="257" y="109" font-size="13" font-weight="700" fill="#263454">06  見比べながら作る</text><rect x="22" y="131" width="210" height="36" rx="9" fill="white" stroke="#5156ba" stroke-width="2"/><text x="31" y="154" font-size="13" font-weight="700" fill="#263454">07  欲しいブロックを検索</text><rect x="248" y="131" width="210" height="36" rx="9" fill="white" stroke="#5156ba" stroke-width="2"/><text x="257" y="154" font-size="13" font-weight="700" fill="#263454">19  関数のつながりを見る</text><rect x="22" y="176" width="210" height="36" rx="9" fill="white" stroke="#5156ba" stroke-width="2"/><text x="31" y="199" font-size="13" font-weight="700" fill="#263454">24  作品全体から探す</text><rect x="248" y="176" width="210" height="36" rx="9" fill="white" stroke="#5156ba" stroke-width="2"/><text x="257" y="199" font-size="11.5" font-weight="700" fill="#263454">36  テスト失敗からコードへ戻る</text><rect x="22" y="221" width="210" height="36" rx="9" fill="white" stroke="#5156ba" stroke-width="2"/><text x="31" y="244" font-size="11.5" font-weight="700" fill="#263454">45  変更をブロックの差分で読む</text><rect x="248" y="221" width="210" height="36" rx="9" fill="white" stroke="#5156ba" stroke-width="2"/><text x="257" y="244" font-size="11.5" font-weight="700" fill="#263454">53  案内役がエディターに現れる</text><rect x="22" y="266" width="210" height="36" rx="9" fill="white" stroke="#16846e" stroke-width="2"/><text x="31" y="289" font-size="13" font-weight="700" fill="#263454">全体の目次</text></g></svg>
