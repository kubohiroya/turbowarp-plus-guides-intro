<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360"><g font-family="Noto Sans JP,Hiragino Kaku Gothic ProN,Arial,sans-serif"><rect width="480" height="360" fill="#edf3fb"/><rect width="480" height="78" fill="#28365d"/><text x="18" y="34" font-size="21" font-weight="700" fill="#ffffff">Guideで体験</text><text x="18" y="58" font-size="12" font-weight="500" fill="#e1e9ff">24 / 56　作品の仕組みを読む</text><text x="18" y="343" font-size="11" font-weight="500" fill="#53617e">Guideを飛ばすには、ステージに戻ってSpace。</text><rect x="16" y="89" width="448" height="95" rx="12" fill="white"/><text x="29" y="114" font-size="13" font-weight="500" fill="#24314b">検索欄を開き、「星を並べる」を入力して、呼び出しと定義を探そ</text><text x="29" y="136" font-size="13" font-weight="500" fill="#24314b">う。</text></g></svg>
