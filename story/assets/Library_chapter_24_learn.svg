<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360"><g font-family="Noto Sans JP,Hiragino Kaku Gothic ProN,Arial,sans-serif"><rect width="480" height="360" fill="#edf3fb"/><path d="M0 265 Q240 205 480 265 V360 H0" fill="#dce9ef"/><rect x="16" y="14" width="448" height="151" rx="18" fill="white"/><rect x="16" y="14" width="7" height="151" rx="3" fill="#6366df"/><text x="34" y="39" font-size="11" font-weight="600" fill="#666b88">24 / 56　作品の仕組みを読む</text><text x="34" y="68" font-size="21" font-weight="700" fill="#263454">作品全体から探す</text><text x="34" y="92" font-size="13.5" font-weight="500" fill="#24314b">上段の検索欄に名前を入れて範囲を選ぶ。変数の読み取りと変更を</text><text x="34" y="112" font-size="13.5" font-weight="500" fill="#24314b">区別して探せる。</text><text x="34" y="132" font-size="13.5" font-weight="500" fill="#24314b">結果から該当位置へ移動。対応する作品内YAMLや文書も検索対象</text><text x="34" y="152" font-size="13.5" font-weight="500" fill="#24314b">にできる。</text><text x="145" y="352" font-size="10" font-weight="500" fill="#626f86">▼が点滅したらクリック／Space</text></g></svg>
