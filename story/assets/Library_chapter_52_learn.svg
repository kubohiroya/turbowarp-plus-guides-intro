<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360"><g font-family="Noto Sans JP,Hiragino Kaku Gothic ProN,Arial,sans-serif"><rect width="480" height="360" fill="#edf3fb"/><path d="M0 265 Q240 205 480 265 V360 H0" fill="#dce9ef"/><rect x="16" y="14" width="448" height="151" rx="18" fill="white"/><rect x="16" y="14" width="7" height="151" rx="3" fill="#6366df"/><text x="34" y="39" font-size="11" font-weight="600" fill="#666b88">52 / 56　履歴を残し共有する</text><text x="34" y="68" font-size="21" font-weight="700" fill="#263454">作品の版を公開する</text><text x="34" y="92" font-size="13.5" font-weight="500" fill="#24314b">渡す版を決め、対応するコミットのSB3やHTMLを確認する。GitHu</text><text x="34" y="112" font-size="13.5" font-weight="500" fill="#24314b">b Releasesも配布先に使える。</text><text x="34" y="132" font-size="13.5" font-weight="500" fill="#24314b">版名と遊び方があると、受け取った人は以前の版と区別できる。</text><text x="70" y="337" font-size="11" font-weight="700" fill="#454fbe">プラ</text><text x="355" y="337" font-size="11" font-weight="700" fill="#178c77">モコ</text><text x="132" y="352" font-size="10" font-weight="500" fill="#626f86">Space：次へ　・　緑の旗：最初から</text></g></svg>
