<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360"><g font-family="Noto Sans JP,Hiragino Kaku Gothic ProN,Arial,sans-serif"><rect width="480" height="360" fill="#edf3fb"/><path d="M0 265 Q240 205 480 265 V360 H0" fill="#dce9ef"/><rect x="16" y="14" width="448" height="151" rx="18" fill="white"/><rect x="16" y="14" width="7" height="151" rx="3" fill="#6366df"/><text x="34" y="39" font-size="11" font-weight="600" fill="#666b88">31 / 56　素材と拡張を使う</text><text x="34" y="68" font-size="21" font-weight="700" fill="#263454">フォームで複雑な値を編集</text><text x="34" y="92" font-size="13.5" font-weight="500" fill="#24314b">対応拡張のブロックからフォームを開き、項目名を見ながら入力す</text><text x="34" y="112" font-size="13.5" font-weight="500" fill="#24314b">る。</text><text x="34" y="132" font-size="13.5" font-weight="500" fill="#24314b">必須項目や型に誤りがあれば、その場で分かる。入れ子の編集を用</text><text x="34" y="152" font-size="13.5" font-weight="500" fill="#24314b">意している拡張もある。</text><text x="145" y="352" font-size="10" font-weight="500" fill="#626f86">▼が点滅したらクリック／Space</text></g></svg>
