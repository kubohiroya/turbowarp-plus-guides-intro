t="700" fill="#263454">履歴と共有（10章）</text><rect x="22" y="266" width="210" height="36" rx="9" fill="white" stroke="#16846e" stroke-width="2"/><text x="31" y="289" font-size="13" font-weight="700" fill="#263454">教材と設定（4章）</text></g></svg>
