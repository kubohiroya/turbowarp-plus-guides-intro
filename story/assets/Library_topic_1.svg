<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360"><g font-family="Noto Sans JP,Hiragino Kaku Gothic ProN,Arial,sans-serif"><rect width="480" height="360" fill="#edf3fb"/><rect width="480" height="78" fill="#28365d"/><text x="18" y="34" font-size="21" font-weight="700" fill="#ffffff">作品を開いて試す</text><text x="18" y="58" font-size="12" font-weight="500" fill="#e1e9ff">クリックした章から練習できます。</text><text x="18" y="343" font-size="11" font-weight="500" fill="#53617e">緑の旗で全体の目次へ。章末からも戻れます。</text><rect x="22" y="86" width="210" height="36" rx="9" fill="white" stroke="#5156ba" stroke-width="2"/><text x="31" y="109" font-size="13" font-weight="700" fill="#263454">01  こんな場面で助かる</text><rect x="248" y="86" width="210" height="36" rx="9" fill="white" stroke="#5156ba" stroke-width="2"/><text x="257" y="109" font-size="11.5" font-weight="700" fill="#263454">02  Scratchの作品を開く</text><rect x="22" y="131" width="210" height="36" rx="9" fill="white" stroke="#5156ba" stroke-width="2"/><text x="31" y="154" font-size="13" font-weight="700" fill="#263454">03  画面の地図を覚える</text><rect x="248" y="131" width="210" height="36" rx="9" fill="white" stroke="#5156ba" stroke-width="2"/><text x="257" y="154" font-size="13" font-weight="700" fill="#263454">04  スプライトをすぐ見つける</text><rect x="22" y="176" width="210" height="36" rx="9" fill="white" stroke="#5156ba" stroke-width="2"/><text x="31" y="199" font-size="13" font-weight="700" fill="#263454">05  実行画面を好きな場所へ</text><rect x="248" y="176" width="210" height="36" rx="9" fill="white" stroke="#5156ba" stroke-width="2"/><text x="257" y="199" font-size="13" font-weight="700" fill="#263454">06  見比べながら作る</text><rect x="22" y="221" width="210" height="36" rx="9" fill="white" stroke="#16846e" stroke-width="2"/><text x="31" y="244" font-size="13" font-weight="700" fill="#263454">全体の目次</text></g></svg>
