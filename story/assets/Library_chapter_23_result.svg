<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360"><g font-family="Noto Sans JP,Hiragino Kaku Gothic ProN,Arial,sans-serif"><rect width="480" height="360" fill="#edf3fb"/><rect width="480" height="78" fill="#28365d"/><text x="18" y="34" font-size="21" font-weight="700" fill="#ffffff">できるようになったこと</text><text x="18" y="58" font-size="12" font-weight="500" fill="#e1e9ff">23 / 56　作品の仕組みを読む</text><text x="18" y="343" font-size="11" font-weight="500" fill="#53617e">別の章からでも、いつでも練習できます。</text><rect x="16" y="89" width="448" height="95" rx="12" fill="white"/><text x="29" y="114" font-size="13" font-weight="500" fill="#24314b">得点は全体、個体差のある残り時間は星専用が自然。変更前に参照</text><text x="29" y="136" font-size="13" font-weight="500" fill="#24314b">とクローンの挙動を確認しよう。</text><rect x="22" y="193" width="210" height="36" rx="9" fill="white" stroke="#5156ba" stroke-width="2"/><text x="31" y="216" font-size="13" font-weight="700" fill="#263454">次の章へ</text><rect x="248" y="193" width="210" height="36" rx="9" fill="white" stroke="#16846e" stroke-width="2"/><text x="257" y="216" font-size="13" font-weight="700" fill="#263454">この分野の章を選ぶ</text><rect x="22" y="238" width="210" height="36" rx="9" fill="white" stroke="#5156ba" stroke-width="2"/><text x="31" y="261" font-size="13" font-weight="700" fill="#263454">もう一度見る</text><rect x="248" y="238" width="210" height="36" rx="9" fill="white" stroke="#16846e" stroke-width="2"/><text x="257" y="261" font-size="13" font-weight="700" fill="#263454">全体の目次</text></g></svg>
