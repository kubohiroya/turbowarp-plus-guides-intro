<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360"><g font-family="Noto Sans JP,Hiragino Kaku Gothic ProN,Arial,sans-serif"><rect width="480" height="360" fill="#edf3fb"/><rect width="480" height="78" fill="#28365d"/><text x="18" y="34" font-size="21" font-weight="700" fill="#ffffff">操作例で確認</text><text x="18" y="58" font-size="12" font-weight="500" fill="#e1e9ff">40 / 56　動作を確かめ保存する</text><text x="18" y="343" font-size="11" font-weight="500" fill="#53617e">操作例や練習が終わったら「結果を見る」。</text><rect x="16" y="89" width="448" height="95" rx="12" fill="white"/><text x="29" y="114" font-size="13" font-weight="500" fill="#24314b">ネットのない場所で開く予定なら、保存と配布の前に何を確かめる</text><text x="29" y="136" font-size="13" font-weight="500" fill="#24314b">？</text><rect x="22" y="202" width="210" height="36" rx="9" fill="white" stroke="#5156ba" stroke-width="2"/><text x="31" y="225" font-size="13" font-weight="700" fill="#263454">結果を見る</text><rect x="248" y="202" width="210" height="36" rx="9" fill="white" stroke="#16846e" stroke-width="2"/><text x="257" y="225" font-size="13" font-weight="700" fill="#263454">この分野の章を選ぶ</text></g></svg>
