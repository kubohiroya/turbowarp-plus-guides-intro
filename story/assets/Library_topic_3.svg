<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360"><g font-family="Noto Sans JP,Hiragino Kaku Gothic ProN,Arial,sans-serif"><rect width="480" height="360" fill="#edf3fb"/><rect width="480" height="78" fill="#28365d"/><text x="18" y="34" font-size="21" font-weight="700" fill="#ffffff">作品の仕組みを読む</text><text x="18" y="58" font-size="12" font-weight="500" fill="#e1e9ff">クリックした章から練習できます。</text><text x="18" y="343" font-size="11" font-weight="500" fill="#53617e">緑の旗で全体の目次へ。章末からも戻れます。</text><rect x="22" y="86" width="210" height="36" rx="9" fill="white" stroke="#5156ba" stroke-width="2"/><text x="31" y="109" font-size="13" font-weight="700" fill="#263454">17  処理の入口を一覧する</text><rect x="248" y="86" width="210" height="36" rx="9" fill="white" stroke="#5156ba" stroke-width="2"/><text x="257" y="109" font-size="13" font-weight="700" fill="#263454">18  一つのスクリプトに集中</text><rect x="22" y="131" width="210" height="36" rx="9" fill="white" stroke="#5156ba" stroke-width="2"/><text x="31" y="154" font-size="13" font-weight="700" fill="#263454">19  関数のつながりを見る</text><rect x="248" y="131" width="210" height="36" rx="9" fill="white" stroke="#5156ba" stroke-width="2"/><text x="257" y="154" font-size="13" font-weight="700" fill="#263454">20  メッセージの行き先を探す</text><rect x="22" y="176" width="210" height="36" rx="9" fill="white" stroke="#5156ba" stroke-width="2"/><text x="31" y="199" font-size="13" font-weight="700" fill="#263454">21  変数とリストの値を見る</text><rect x="248" y="176" width="210" height="36" rx="9" fill="white" stroke="#5156ba" stroke-width="2"/><text x="257" y="199" font-size="13" font-weight="700" fill="#263454">22  変数やリストを統合する</text><rect x="22" y="221" width="210" height="36" rx="9" fill="white" stroke="#5156ba" stroke-width="2"/><text x="31" y="244" font-size="11.5" font-weight="700" fill="#263454">23  変数を共有する範囲を変える</text><rect x="248" y="221" width="210" height="36" rx="9" fill="white" stroke="#5156ba" stroke-width="2"/><text x="257" y="244" font-size="13" font-weight="700" fill="#263454">24  作品全体から探す</text><rect x="22" y="266" width="210" height="36" rx="9" fill="white" stroke="#5156ba" stroke-width="2"/><text x="31" y="289" font-size="13" font-weight="700" fill="#263454">25  直す場所だけ置換する</text><rect x="248" y="266" width="210" height="36" rx="9" fill="white" stroke="#16846e" stroke-width="2"/><text x="257" y="289" font-size="13" font-weight="700" fill="#263454">全体の目次</text></g></svg>
