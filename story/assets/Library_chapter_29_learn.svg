<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360"><g font-family="Noto Sans JP,Hiragino Kaku Gothic ProN,Arial,sans-serif"><rect width="480" height="360" fill="#edf3fb"/><path d="M0 265 Q240 205 480 265 V360 H0" fill="#dce9ef"/><rect x="16" y="14" width="448" height="151" rx="18" fill="white"/><rect x="16" y="14" width="7" height="151" rx="3" fill="#6366df"/><text x="34" y="39" font-size="11" font-weight="600" fill="#666b88">29 / 56　素材と拡張を使う</text><text x="34" y="68" font-size="21" font-weight="700" fill="#263454">カタログから拡張を追加</text><text x="34" y="92" font-size="13.5" font-weight="500" fill="#24314b">拡張ボタンやパレットの追加操作からライブラリを開き、公式カタ</text><text x="34" y="112" font-size="13.5" font-weight="500" fill="#24314b">ログで名前と説明を読む。</text><text x="34" y="132" font-size="13.5" font-weight="500" fill="#24314b">追加すると対応ブロックのカテゴリが使える。使う用途から探すと</text><text x="34" y="152" font-size="13.5" font-weight="500" fill="#24314b">依存用の項目と見分けやすい。</text><text x="145" y="352" font-size="10" font-weight="500" fill="#626f86">▼が点滅したらクリック／Space</text></g></svg>
