<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360"><g font-family="Noto Sans JP,Hiragino Kaku Gothic ProN,Arial,sans-serif"><rect width="480" height="360" fill="#edf3fb"/><path d="M0 265 Q240 205 480 265 V360 H0" fill="#dce9ef"/><rect x="16" y="14" width="448" height="151" rx="18" fill="white"/><rect x="16" y="14" width="7" height="151" rx="3" fill="#6366df"/><text x="34" y="39" font-size="11" font-weight="600" fill="#666b88">35 / 56　動作を確かめ保存する</text><text x="34" y="68" font-size="21" font-weight="700" fill="#263454">期待する動きをテストにする</text><text x="34" y="92" font-size="13.5" font-weight="500" fill="#24314b">TurboWarp-Testのテストハットに名前を付けて、準備、操作、確</text><text x="34" y="112" font-size="13.5" font-weight="500" fill="#24314b">かめるブロックを書く。</text><text x="34" y="132" font-size="13.5" font-weight="500" fill="#24314b">例えば得点0から加点を一度呼び、結果が10と期待する。一つのテ</text><text x="34" y="152" font-size="13.5" font-weight="500" fill="#24314b">ストの期待を短く名前にする。</text><text x="145" y="352" font-size="10" font-weight="500" fill="#626f86">▼が点滅したらクリック／Space</text></g></svg>
